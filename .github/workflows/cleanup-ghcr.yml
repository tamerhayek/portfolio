name: Cleanup GHCR

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: cleanup-ghcr-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete untagged and sha-tagged versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: portfolio
        run: |
          set -euo pipefail
          gh api --paginate "/users/$OWNER/packages/container/$PKG/versions" \
            --jq '.[] | select(
              (.metadata.container.tags | length == 0) or
              (.metadata.container.tags | all(test("^[0-9a-f]{7}$")))
            ) | .id' \
          | while read -r id; do
              gh api --method DELETE "/users/$OWNER/packages/container/$PKG/versions/$id"
              echo "Deleted version $id"
            done
